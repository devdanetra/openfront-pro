<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clan hub - OpenFront Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="content.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <style>
      /* Colours come only from the --ofr-* tokens in content.css (the theme blocks). */
      body {
        margin: 0;
        background: var(--ofr-stage-bg);
        color: var(--ofr-text);
        font: 14px/1.45 var(--ofr-ui-font);
      }
      html { scrollbar-color: var(--ofr-btn-border) var(--ofr-stage-bg); }
      [hidden] { display: none !important; }
      a { color: var(--ofr-average); }
      a.ofr-btn { color: var(--ofr-text); }
      :is(a, button, input):focus-visible {
        outline: var(--ofr-focus-width, 2px) solid var(--ofr-focus-color, var(--ofr-average));
        outline-offset: var(--ofr-focus-offset, 2px);
      }
      .hub { box-sizing: border-box; max-width: 1180px; margin: 0 auto; padding: 20px 24px 64px; }

      /* ---- top: brand + tabs ---------------------------------------------------------- */
      .hub-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
      .hub-brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
      .hub-brand img { width: 32px; height: 32px; border-radius: 8px; }
      .hub-brand h1 { margin: 0; font-size: var(--ofr-fs-xl, 18px); line-height: var(--ofr-lh-tight, 1.15); }
      .hub-top .ofr-tabs { flex: 1 1 420px; max-width: 560px; }
      .hub-top .ofr-tab { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .hub-top .ofr-tab .ofr-icon { width: 16px; height: 16px; flex: none; }

      /* ---- building blocks ------------------------------------------------------------ */
      .hub-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .hub-grid > .wide { grid-column: 1 / -1; }
      .hub-card { box-sizing: border-box; min-width: 0; padding: 14px 16px; }
      .hub-card > .ofr-eyebrow { display: flex; align-items: center; gap: 8px; }
      .hub-card > .ofr-eyebrow .ofr-icon { width: 14px; height: 14px; color: var(--ofr-text-dim); }
      .hub-dim { color: var(--ofr-text-dim); }
      .hub-note { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-sm, 12px); }
      .hub-note .ofr-icon { flex: none; width: 16px; height: 16px; color: var(--ofr-accent); }
      .hub-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
      .hub-bar .grow { flex: 1; }
      .hub-tagbtn { padding: 0; border: 0; background: none; color: var(--ofr-text); font: inherit; font-weight: var(--ofr-fw-bold, 700); cursor: pointer; }
      .hub-tagbtn:hover { color: var(--ofr-accent-ink, var(--ofr-accent)); }
      .hub-spark { width: 96px; height: 26px; }
      .hub-spark .ofr-chart-line { stroke: var(--ofr-accent); stroke-width: 1.6; }
      .hub-spark .ofr-chart-dot { fill: var(--ofr-accent); }
      .hub-delta { display: inline-flex; align-items: center; min-width: 26px; font-size: var(--ofr-fs-2xs, 10px); font-weight: var(--ofr-fw-bold, 700); font-variant-numeric: tabular-nums; }
      .hub-delta[data-dir="up"] { color: var(--ofr-good); }
      .hub-delta[data-dir="down"] { color: var(--ofr-elite); }
      .hub-delta[data-dir="new"] { color: var(--ofr-accent-ink, var(--ofr-accent)); }
      .hub-delta[data-dir="same"] { color: var(--ofr-text-dim); }
      .hub-input { width: 110px; text-transform: uppercase; }
      .hub-seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--ofr-panel-border); border-radius: var(--ofr-radius-control, 6px); }
      .hub-seg button { min-height: var(--ofr-ctl-h-sm, 24px); padding: 0 10px; border: 0; border-radius: var(--ofr-radius-inner, 4px); background: none;
        color: var(--ofr-text-dim); font: var(--ofr-fw-semibold, 600) var(--ofr-fs-xs, 11px)/1 var(--ofr-ui-font); cursor: pointer; }
      .hub-seg button:hover { color: var(--ofr-text); }
      .hub-seg button[aria-pressed="true"] { background: var(--ofr-btn-hover); color: var(--ofr-text); box-shadow: inset 0 -2px 0 var(--ofr-accent); }
      .hub-seg .ofr-icon { width: 14px; height: 14px; }
      .hub-seg-label { display: inline-flex; align-items: center; padding: 0 6px 0 4px; color: var(--ofr-text-dim); }
      .hub-seg-label .ofr-icon { width: 14px; height: 14px; }

      /* ---- leaderboard ---------------------------------------------------------------- */
      .hub-week { display: flex; align-items: center; gap: 6px; }
      .hub-week-label { display: flex; flex-direction: column; align-items: center; min-width: 118px; line-height: 1.15; }
      .hub-week-label b { font-size: var(--ofr-fs-xl, 18px); }
      .hub-week-label small { color: var(--ofr-text-dim); font-size: var(--ofr-fs-xs, 11px); }
      .hub-cotw { gap: 6px; }
      .hub-cotw .ofr-icon { width: 13px; height: 13px; color: var(--ofr-strong); }
      .hub-movers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
      .hub-movers-col { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
      .hub-movers-col > .ofr-icon { width: 18px; height: 18px; flex: none; }
      .hub-movers-col[data-dir="up"] > .ofr-icon { color: var(--ofr-good); }
      .hub-movers-col[data-dir="down"] > .ofr-icon { color: var(--ofr-elite); transform: scaleY(-1); }
      .hub-mover { gap: 6px; }
      .hub-mover .hub-delta { min-width: 0; }

      .hub-table { display: grid; gap: 2px; }
      .hub-row {
        display: grid; align-items: center; gap: 12px;
        grid-template-columns: 34px 30px 76px minmax(110px, 1.3fr) minmax(110px, 1fr) 58px 70px 100px;
        min-height: 28px; padding: 2px 10px; border-radius: var(--ofr-radius-inner, 6px);
        font-variant-numeric: tabular-nums;
      }
      .hub-row:not(.hub-head):hover { background: var(--ofr-btn-bg); }
      .hub-row.mine { box-shadow: inset 0 0 0 1px var(--ofr-accent); }
      .hub-head { min-height: 22px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-2xs, 10px); font-weight: var(--ofr-fw-bold, 700);
        letter-spacing: var(--ofr-tracking-label, 0.07em); text-transform: uppercase; }
      .hub-rank { color: var(--ofr-text-dim); font-weight: var(--ofr-fw-bold, 700); text-align: right; }
      .hub-row[data-top="1"] .hub-rank { color: var(--ofr-strong); }
      .hub-bar-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .hub-bar-cell .ofr-meter { flex: 1; height: 8px; }
      .hub-bar-cell > span:last-child { flex: none; min-width: 38px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-xs, 11px); text-align: right; }
      .hub-num { color: var(--ofr-text-dim); font-size: var(--ofr-fs-sm, 12px); text-align: right; }
      .hub-members { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-sm, 12px); }
      .hub-members .ofr-icon { width: 14px; height: 14px; }
      .hub-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-xs, 11px); }
      .hub-legend span { display: inline-flex; align-items: center; gap: 6px; }
      .hub-legend i { display: inline-block; width: 10px; height: 8px; border-radius: 2px; background: var(--ofr-c, var(--ofr-average)); }
      .hub-legend i.tick { width: 2px; height: 12px; background: var(--ofr-text); }
      .hub-legend i.good { --ofr-c: var(--ofr-good); }
      .hub-legend i.accent { --ofr-c: var(--ofr-accent); }

      /* ---- clan page ---------------------------------------------------------------- */
      .hub-hero { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
      .hub-hero-tag { font-size: var(--ofr-fs-3xl, 28px); font-weight: var(--ofr-fw-heavy, 800); line-height: 1; }
      .hub-hero-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .hub-hero-chips .ofr-chip { height: 24px; font-size: var(--ofr-fs-xs, 11px); }
      .hub-hero-chips .ofr-icon { width: 13px; height: 13px; }
      .hub-hero .actions { display: flex; gap: 6px; margin-left: auto; }
      .hub-rings { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 10px; }
      .hub-rings .ofr-modering { flex: 1 1 0; min-width: 84px; max-width: 170px; padding: 10px 4px 8px; }
      .hub-rings .ofr-ring { width: 76px; height: 76px; }
      .hub-axis { display: flex; justify-content: space-between; margin: 2px 6px 0 30px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-2xs, 10px); }
      .hub-rows { display: grid; gap: 7px; }
      .hub-mrow { display: grid; grid-template-columns: minmax(74px, max-content) minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: var(--ofr-fs-sm, 12px); }
      .hub-mrow > span:first-child { overflow: hidden; color: var(--ofr-text-dim); text-overflow: ellipsis; white-space: nowrap; }
      .hub-mrow > span:last-child { color: var(--ofr-text-dim); text-align: right; font-variant-numeric: tabular-nums; }
      .hub-mrow .ofr-meter { height: 10px; }
      .hub-strength { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-bottom: 12px; }
      .hub-strength .ofr-bands { flex: 1 1 260px; max-width: 360px; }
      .hub-strength-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .hub-strength-item > small { color: var(--ofr-text-dim); font-size: var(--ofr-fs-2xs, 10px); font-weight: var(--ofr-fw-bold, 700);
        letter-spacing: var(--ofr-tracking-label, 0.07em); text-transform: uppercase; }
      .hub-progress { display: flex; align-items: center; gap: 8px; min-width: 140px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-xs, 11px); }
      .hub-progress .ofr-meter { flex: 1; height: 4px; }
      .hub-mlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 18px; }
      .hub-member { min-width: 0; border-radius: var(--ofr-radius-inner, 6px); }
      .hub-member[data-open="true"] { grid-column: 1 / -1; background: var(--ofr-panel-bg); }
      .hub-member-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) 64px minmax(60px, 90px) 40px 18px; align-items: center; gap: 10px;
        box-sizing: border-box; width: 100%; min-height: 32px; padding: 3px 8px; border: 0; border-radius: inherit; background: none;
        color: var(--ofr-text); font: inherit; font-size: var(--ofr-fs-sm, 12px); text-align: left; cursor: pointer; }
      .hub-member-row:hover { background: var(--ofr-btn-bg); }
      .hub-member-row > .name { overflow: hidden; font-weight: var(--ofr-fw-semibold, 600); text-overflow: ellipsis; white-space: nowrap; }
      .hub-member-row > .name .ofr-icon { width: 12px; height: 12px; margin-left: 4px; color: var(--ofr-strong); vertical-align: -1px; }
      .hub-member-row > .games { color: var(--ofr-text-dim); text-align: right; font-variant-numeric: tabular-nums; }
      .hub-member-row > .chev { color: var(--ofr-text-dim); transition: transform var(--ofr-dur-1, 120ms) var(--ofr-ease-out, ease-out); }
      .hub-member[data-open="true"] .chev { transform: rotate(90deg); }
      .hub-member-row .ofr-badge { justify-self: start; font-size: var(--ofr-fs-2xs, 10px); }
      .hub-member-row .ofr-meter { height: 6px; }
      .hub-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ofr-track); }
      .hub-dot[data-level="week"] { background: var(--ofr-good); }
      .hub-dot[data-level="month"] { background: color-mix(in srgb, var(--ofr-good) 45%, var(--ofr-track)); }
      .hub-more { margin-top: 10px; }
      .hub-offline { display: flex; align-items: center; gap: 8px; font-size: var(--ofr-fs-xs, 11px); }
      .hub-banner { padding: 8px 12px; border: 1px solid var(--ofr-panel-border); border-radius: var(--ofr-radius-control, 6px); background: var(--ofr-panel-bg); color: var(--ofr-text); }

      /* mini profile (a member, a recruit) */
      .hub-prof { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 6px 14px; padding: 8px 10px 12px; }
      .hub-prof .ofr-ring { width: 76px; height: 76px; }
      .hub-prof .ofr-ring-value { font-size: 24px; }
      .hub-prof-body { display: grid; gap: 7px; min-width: 0; }
      .hub-prof-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
      .hub-prof-line .ofr-meter { flex: 1 1 120px; max-width: 220px; }
      .hub-prof-line .ofr-dash-strip-cell { width: 10px; height: 16px; }
      .hub-prof-line .ofr-dash-strip-cell[data-mode="duel"] { height: 10px; }
      .hub-prof-line .ofr-stack { flex: 1 1 200px; max-width: 320px; }
      .hub-prof-line .ofr-stack .ofr-chart-legend { margin: 3px 0 0; }
      .hub-prof-name { overflow: hidden; font-size: var(--ofr-fs-md, 13px); font-weight: var(--ofr-fw-bold, 700); text-overflow: ellipsis; white-space: nowrap; }
      .hub-prof-name:is(:only-child) { flex: 1; }
      .hub-prof a.hub-out { display: inline-flex; align-items: center; gap: 4px; font-size: var(--ofr-fs-xs, 11px); }
      .hub-prof a.hub-out .ofr-icon { width: 12px; height: 12px; }
      .hub-seen { display: inline-flex; align-items: center; gap: 5px; color: var(--ofr-text-dim); font-size: var(--ofr-fs-xs, 11px); }
      .hub-seen .ofr-icon { width: 13px; height: 13px; }

      /* ---- compare ---------------------------------------------------------------------- */
      .hub-vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; margin-bottom: 14px; }
      .hub-vs-side { display: flex; align-items: center; gap: 14px; min-width: 0; }
      .hub-vs-side.b { flex-direction: row-reverse; text-align: right; }
      .hub-vs-side .ofr-ring { width: 84px; height: 84px; }
      .hub-vs-tag { font-size: var(--ofr-fs-2xl, 24px); font-weight: var(--ofr-fw-heavy, 800); }
      .hub-vs-side.a .hub-vs-tag { color: var(--ofr-accent-ink, var(--ofr-accent)); }
      .hub-vs-side.b .hub-vs-tag { color: var(--ofr-average); }
      .hub-vs-mid { color: var(--ofr-text-dim); font-weight: var(--ofr-fw-heavy, 800); }
      .hub-vs .ofr-ring[data-kind="average"] { --ofr-c: var(--ofr-average); }
      .hub-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .hub-h2h-strip { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 10px; }
      .hub-h2h-cell { width: 14px; height: 22px; border-radius: 3px; background: var(--ofr-track); }
      .hub-h2h-cell[data-outcome="a"] { background: var(--ofr-accent); }
      .hub-h2h-cell[data-outcome="b"] { background: var(--ofr-average); }
      .hub-h2h-cell[data-outcome="allies"] { background: var(--ofr-good); }
      .hub-h2h-cell[data-outcome="neither"] { background: var(--ofr-low); }
      .hub-h2h-cell[data-outcome="unknown"] { background: none; box-shadow: inset 0 0 0 2px var(--ofr-track); }
      .hub-score { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
      .hub-score b { font-size: 40px; line-height: 1; }
      .hub-score .a { color: var(--ofr-accent-ink, var(--ofr-accent)); }
      .hub-score .b { color: var(--ofr-average); }
      .hub-score .sep { color: var(--ofr-text-dim); font-size: var(--ofr-fs-lg, 15px); }
      .hub-chart-key { display: flex; justify-content: center; gap: 16px; margin-top: 6px; font-size: var(--ofr-fs-xs, 11px); font-weight: var(--ofr-fw-bold, 700); }
      .hub-chart-key .a { color: var(--ofr-accent-ink, var(--ofr-accent)); }
      .hub-chart-key .b { color: var(--ofr-average); }
      .hub-cmp-line .ofr-chart-line:not(.accent) { stroke: var(--ofr-average); }

      /* ---- recruits ----------------------------------------------------------------- */
      .hub-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
      .hub-count { margin-left: auto; color: var(--ofr-text-dim); font-size: var(--ofr-fs-sm, 12px); font-variant-numeric: tabular-nums; }
      .hub-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
      .hub-cards .ofr-tile { min-width: 0; }
      .hub-cards .hub-prof { padding: 10px 12px; }

      @media (max-width: 900px) {
        .hub { padding: 14px 14px 48px; }
        .hub-grid { grid-template-columns: minmax(0, 1fr); }
        .hub-row { grid-template-columns: 26px 26px 60px minmax(80px, 1fr) minmax(90px, 1fr) 54px; gap: 8px; padding: 3px 6px; }
        .hub-row > :nth-child(6), .hub-row > :nth-child(8) { display: none; }
        .hub-mlist { grid-template-columns: minmax(0, 1fr); }
        .hub-movers { grid-template-columns: minmax(0, 1fr); }
        .hub-vs-side .ofr-ring { width: 64px; height: 64px; }
        .hub-vs-tag { font-size: var(--ofr-fs-xl, 18px); }
        .hub-cards { grid-template-columns: minmax(0, 1fr); }
        .ofr-mirror-row { grid-template-columns: minmax(0, 1fr) 96px minmax(0, 1fr); gap: 8px; }
        .ofr-mirror-value { flex-basis: 58px; }
      }
    </style>
  </head>
  <body>
    <div class="hub">
      <header class="hub-top">
        <div class="hub-brand">
          <img src="../icons/icon48.png" alt="" />
          <h1>Clan hub</h1>
          <span class="ofr-chip" title="Not affiliated with OpenFront. Data: ofstats.io">Unofficial</span>
        </div>
        <nav class="ofr-tabs" role="tablist" aria-label="Clan hub views" id="tabs"></nav>
      </header>
      <div id="banner" hidden></div>
      <main id="view" aria-live="polite"></main>
    </div>
    <script src="themes.js"></script>
    <script src="scoring.js"></script>
    <script src="charts.js"></script>
    <script src="clans-logic.js"></script>
    <script src="clans.js"></script>
  </body>
</html>
